name: ai-support-agent

services:
  server:
    build: ./server
    # MONGODB_URI (Atlas), JWT_SECRET and OPENROUTER_API_KEY come from server/.env (never baked into the image).
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "1"
      # Local Docker serves plain HTTP; must be "true" behind HTTPS.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CLIENT_ORIGIN: http://localhost:8080
      OPENROUTER_APP_URL: http://localhost:8080
    expose:
      - "5000"
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
